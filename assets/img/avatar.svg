<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a2038"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c49564"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142850"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>

  <!-- Accent glow -->
  <circle cx="200" cy="200" r="180" fill="url(#accentGlow)" filter="url(#softShadow)"/>

  <!-- Body/Shoulders -->
  <ellipse cx="200" cy="380" rx="140" ry="100" fill="url(#hoodieGrad)" filter="url(#softShadow)"/>

  <!-- Hoodie upper -->
  <path d="M60,290 Q60,230 90,210 Q130,180 200,170 Q270,180 310,210 Q340,230 340,290 L340,380 Q340,395 200,400 Q60,395 60,380 Z" fill="url(#hoodieGrad)" filter="url(#softShadow)"/>

  <!-- Hoodie detail lines -->
  <path d="M140,285 Q160,270 180,275 Q200,280 220,275 Q240,270 260,285" fill="none" stroke="#2a4a7a" stroke-width="1.5" opacity="0.6"/>
  <path d="M120,320 Q150,305 180,310 Q200,315 220,310 Q250,305 280,320" fill="none" stroke="#2a4a7a" stroke-width="1.5" opacity="0.6"/>

  <!-- Neck -->
  <path d="M155,280 Q160,265 170,280 L170,280 L180,280 Q180,265 190,280 L190,280 L200,280 Q200,265 210,280 L210,280 L220,280 Q220,265 230,280" fill="url(#skinGrad)"/>

  <!-- Face base -->
  <ellipse cx="200" cy="225" rx="72" ry="85" fill="url(#skinGrad)"/>

  <!-- Face shadow -->
  <ellipse cx="210" cy="240" rx="45" ry="50" fill="#b88a5a" opacity="0.15"/>

  <!-- Ears -->
  <ellipse cx="128" cy="225" rx="8" ry="18" fill="url(#skinGrad)"/>
  <ellipse cx="272" cy="225" rx="8" ry="18" fill="url(#skinGrad)"/>

  <!-- Hair back -->
  <path d="M128,155 Q100,140 85,180 Q70,220 60,260 Q55,290 70,320 Q90,360 130,370 L130,380 Q130,395 200,400 Q270,395 270,380 L270,370 Q310,360 330,320 Q345,290 340,260 Q330,220 315,180 Q300,140 272,155 Q260,140 235,130 Q210,120 200,115 Q190,120 165,130 Q140,140 128,155" fill="url(#hairGrad)"/>

  <!-- Eyebrows -->
  <path d="M160,185 Q170,180 185,188" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M215,188 Q230,180 240,185" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyes -->
  <ellipse cx="168" cy="205" rx="14" ry="16" fill="#ffffff"/>
  <ellipse cx="232" cy="205" rx="14" ry="16" fill="#ffffff"/>

  <!-- Iris -->
  <ellipse cx="168" cy="207" rx="7" ry="9" fill="#2d3a5c"/>
  <ellipse cx="232" cy="207" rx="7" ry="9" fill="#2d3a5c"/>

  <!-- Pupil -->
  <ellipse cx="168" cy="208" rx="3.5" ry="4.5" fill="#0d0d1a"/>
  <ellipse cx="232" cy="208" rx="3.5" ry="4.5" fill="#0d0d1a"/>

  <!-- Eye highlights -->
  <ellipse cx="163" cy="202" rx="2.5" ry="2.5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="227" cy="202" rx="2.5" ry="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="172" cy="211" r="1.2" fill="#ffffff" opacity="0.4"/>
  <circle cx="236" cy="211" r="1.2" fill="#ffffff" opacity="0.4"/>

  <!-- Nose -->
  <path d="M195,225 Q200,232 205,225" fill="none" stroke="#c49564" stroke-width="2" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M170,248 Q200,262 230,248" fill="none" stroke="#a67c52" stroke-width="3" stroke-linecap="round"/>
  <path d="M175,248 Q200,254 225,248" fill="none" stroke="#ffd166" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Cheeks -->
  <ellipse cx="150" cy="230" rx="12" ry="8" fill="#e8a87c" opacity="0.25"/>
  <ellipse cx="250" cy="230" rx="12" ry="8" fill="#e8a87c" opacity="0.25"/>

  <!-- Hair front strands -->
  <path d="M140,125 Q135,140 145,155 Q150,165 145,175" fill="none" stroke="url(#hairGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M155,120 Q150,135 160,150 Q165,160 160,170" fill="none" stroke="url(#hairGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M245,120 Q250,135 240,150 Q235,160 240,170" fill="none" stroke="url(#hairGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M260,125 Q265,140 255,155 Q250,165 255,175" fill="none" stroke="url(#hairGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Hair side strands -->
  <path d="M110,180 Q95,200 105,225 Q115,245 120,260" fill="none" stroke="url(#hairGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M290,180 Q305,200 295,225 Q285,245 280,260" fill="none" stroke="url(#hairGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Hair tie -->
  <ellipse cx="295" cy="245" rx="12" ry="8" fill="#f5b700" opacity="0.9"/>
  <ellipse cx="295" cy="245" rx="8" ry="5" fill="#ffd166"/>

  <!-- Yellow accent dots on hoodie -->
  <circle cx="170" cy="320" r="3" fill="#ffd166" opacity="0.7"/>
  <circle cx="230" cy="320" r="3" fill="#ffd166" opacity="0.7"/>
  <circle cx="170" cy="345" r="2" fill="#ffd166" opacity="0.5"/>
  <circle cx="230" cy="345" r="2" fill="#ffd166" opacity="0.5"/>

  <!-- Subtle rim light on face -->
  <path d="M272,180 Q272,225 272,270" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
</svg>
